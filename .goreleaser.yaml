# The release. `make snapshot` runs this without a tag, which is what makes the
# release path testable before there is a release.
#
# One thing here is deliberately missing: there is no -X flag setting a version.
# internal/cli.Version is the source of truth, and the release workflow gates on
# the tag agreeing with it. A version injected at link time would be correct in
# this one build and absent from every other.
version: 2

project_name: eva

before:
  hooks:
    - go mod download

builds:
  - id: eva
    main: ./cmd/eva
    binary: eva
    env:
      - CGO_ENABLED=0
    flags:
      # trimpath so the binary carries no build machine's paths. Two builds of
      # one commit are then the same bytes, which is what makes a checksum worth
      # publishing.
      - -trimpath
    ldflags:
      - -s -w
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: eva
    ids: [eva]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SBOM per archive, so a consumer can audit what they installed without
# building it. This needs syft, which the release workflow installs and a local
# snapshot skips.
sboms:
  - id: archive
    artifacts: archive

# Keyless, over the checksum file. The workflow's own OIDC identity is the key,
# so there is no secret to store and nothing to rotate. Verifying it proves the
# checksums came from this repository's release workflow.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# A release candidate is not the previous release, and without this it becomes
# one. The fold below runs from the previous tag, so v0.1.1 released after
# v0.1.1-rc.1 would list only what landed between the two — and everything the
# candidate already carried would be missing from the notes of the release that
# actually shipped it. Measured, then fixed here.
#
# Releasing the candidate itself is unaffected: the current tag comes from the
# commit being released, not from the search this narrows.
git:
  ignore_tags:
    - "*-rc.*"

# The body of the release notes, folded over the commits in the tag's range. It
# groups by the prefixes AGENTS.md requires. Nothing checks those prefixes, so a
# commit written without one is omitted here silently — the fold cannot group
# what does not match.
changelog:
  use: github
  sort: asc
  groups:
    - title: Breaking
      regexp: '^.*?\w+(\([[:word:]]+\))??!:.+$'
      order: 0
    - title: Added
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Fixed
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Changed
      regexp: '^.*?(refactor|perf)(\([[:word:]]+\))??!?:.+$'
      order: 3
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^build"
      - "^ci"
      - "^chore"
      - "^Merge"

release:
  # auto reads the tag: v0.3.0-rc.1 is a prerelease, v0.3.0 is not. This is what
  # keeps the next channel out of the stable one without a second configuration
  # path.
  prerelease: auto

  # And latest follows from the same fact rather than being asserted beside it.
  # A prerelease that also claimed to be latest would be asking GitHub for two
  # contradictory things, and "the newest stable release" is the one thing an
  # installer reads this field for.
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
  mode: replace
  footer: |
    ---
    ## Verify what you downloaded

    ```bash
    sha256sum --check --ignore-missing checksums.txt
    ```

    The checksums themselves are signed, and each archive carries a provenance
    attestation naming the workflow and commit that built it. Both commands are
    in [Verify what you downloaded](https://github.com/missingstudio/eva/blob/{{ .Tag }}/docs/how-to/install-eva.md#verify-what-you-downloaded).

# The macOS install path, and the only place a release writes to a second
# repository. `brew install --cask missingstudio/tap/eva` resolves to
# missingstudio/homebrew-tap, where the release commits the file below beside the
# formulae already there.
#
# `make snapshot` writes the file this would push, to dist/homebrew/Casks, with
# no tag and no token — so `make rehearse` reads it and a wrong archive name is
# caught here rather than in the tap.
homebrew_casks:
  - name: eva
    ids: [eva]
    binaries: [eva]

    repository:
      owner: missingstudio
      name: homebrew-tap
      # The only stored secret this repository has: fine-grained,
      # contents:write, on the tap and nothing else. It is spent after the
      # release is published, so an expired token leaves a public release and a
      # stale tap rather than a failed release.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

    homepage: https://github.com/missingstudio/eva
    description: An autonomous, AI-native software factory

    # `auto` reads the tag the way `release.prerelease` above does: v0.3.0-rc.1
    # is skipped and v0.3.0 is published. The tap is the stable channel by the
    # same fact that decides the release, and not by a second rule that could
    # disagree with it.
    skip_upload: auto

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/eva"]
          end
