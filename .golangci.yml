version: "2"

# The layer boundaries are enforced here, by depguard, rather than by a
# hand-written test. Every rule uses list-mode "strict": an import is allowed
# only if it appears in the allow list. That means the rules fail CLOSED — a
# dependency nobody thought about is rejected rather than quietly permitted.
#
# Adding a line to an allow list is therefore a deliberate act, and reviewing
# that line is how a layer's contract stays true.

linters:
  enable:
    - depguard
    
  settings:
    depguard:
      rules:
        # events is the bottom of the graph: every layer may depend on it, so a
        # dependency here becomes a dependency everywhere. Standard library only.
        events:
          list-mode: strict
          files:
            - "**/internal/events/**"
          allow:
            - $gostd
            # The external test package events_test sits in this directory and
            # imports the package it tests. A package cannot import itself, so
            # this line reaches test files and nothing else.
            - github.com/missingstudio/eva/internal/events

        # core is pure. It holds the domain and the interfaces the outer layers
        # implement, and it never reaches the outside world.
        #
        # The allow list is deliberately almost empty. core currently imports
        # nothing, and each standard-library package it comes to need should be
        # added here on purpose, by whoever needs it, rather than inherited from
        # a blanket $gostd. That friction is the contract doing its job.
        core:
          list-mode: strict
          files:
            - "**/internal/core/**"
            # Test files are governed by core-tests below. Two rules matching
            # one file both apply, so this one has to stand aside rather than
            # the other one being made more permissive.
            - "!**/internal/core/**_test.go"
            # The base system prompt is governed by core-prompt below, which is
            # what lets embed be granted to the one package that reads a file
            # rather than to the whole of the domain.
            - "!**/internal/core/prompt/**"
          allow:
            - github.com/missingstudio/eva/internal/events
            # context, for the TraceSink interface: a durable append is
            # cancellable, and an interface that cannot carry cancellation
            # forces every implementation to invent its own.
            - context
            # sync, for the Recorder. It owns the wire position and it is the
            # one path an Event takes to the Trace, and stage 2 runs parallel
            # tool groups against one Recorder. A counter that is only safe by
            # convention is a data race waiting for its second goroutine.
            - sync
            # errors and fmt, for the Recorder's own failures. A Recorder
            # built without a clock, and a payload this schema does not know,
            # are both reported rather than written.
            - errors
            - fmt

        # core's tests get the standard library, and nothing else core does not
        # already have. The rule is separate so that core's own allow list stays
        # the short, deliberate list it was written as — a test needing a
        # package must not be the reason production code may import it.
        core-tests:
          list-mode: strict
          files:
            - "**/internal/core/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core

        # core/prompt holds the base system prompt and the gate on its size. It
        # is the one package under core that reads a file, and it reads it at
        # compile time: embed puts the bytes in the binary, so nothing reaches
        # the filesystem while a Run is going and core stays pure.
        #
        # It is a rule of its own so that embed is granted to the package that
        # needs it instead of to the whole domain. The two cannot import each
        # other — neither list names the other, and both are strict — which is
        # what keeps the prose a turn is conditioned on from growing a
        # dependency on the domain it conditions.
        core-prompt:
          list-mode: strict
          files:
            - "**/internal/core/prompt/**"
            - "!**/internal/core/prompt/**_test.go"
          allow:
            - embed
            - fmt

        # The gate on the prompt's size is a test, so it gets what a test needs
        # and core/prompt keeps the two-package list above.
        core-prompt-tests:
          list-mode: strict
          files:
            - "**/internal/core/prompt/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/core/prompt

        # auth holds subscription Credentials: the store they live in, the
        # source that keeps one fresh, and the login flow that obtains one. It
        # talks to one thing — the vendor's authorization server — and gets the
        # standard library alone: no config, so the layer that reads the
        # configuration file is still the only layer that reads it (the store's
        # path is passed in); no providers, so a credential cannot select what
        # it authenticates.
        auth:
          list-mode: strict
          files:
            - "**/internal/auth/**"
          allow:
            - $gostd

        # config reads files, so it sits outside core.
        config:
          list-mode: strict
          files:
            - "**/internal/config/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/BurntSushi/toml
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/config

        # providers holds the contract: the Provider and Stream interfaces, and
        # the Call a turn is asked with. It talks to nothing — the packages
        # under it do — so it gets no vendor's SDK and no file format.
        #
        # Each implementation has a rule of its own below. One rule over the
        # whole subtree would grant every dependency to every implementation,
        # so the OpenAI Provider would be allowed the Anthropic SDK and the
        # contract suite would be allowed both. Each list says what it is for,
        # and having its own is what lets it enforce that.
        providers:
          list-mode: strict
          files:
            - "**/internal/providers/**"
            - "!**/internal/providers/anthropic/**"
            - "!**/internal/providers/openai/**"
            - "!**/internal/providers/providertest/**"
            - "!**/internal/providers/retry/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # core, for the Message a Call carries. It is the transcript a turn
            # is conditioned on, and it is the whole of what this layer needs
            # from the domain.
            - github.com/missingstudio/eva/internal/core
            # retry, for the Policy a caller chooses. The rule is one rule and
            # it lives below this layer, so what crosses the seam is the leaf's
            # own type rather than a second copy of it here.
            - github.com/missingstudio/eva/internal/providers/retry
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/providers

        # retry is how a refused attempt is retried, and nothing else. It is a
        # leaf beside the implementations rather than a file inside one because
        # two Providers need the same arithmetic and neither may import the
        # other.
        #
        # The standard library alone. No events, so it cannot name why an
        # attempt failed — that is learned from a wire, each Provider has its
        # own, and a rule that could read one would be a rule with an opinion
        # about which.
        providers-retry:
          list-mode: strict
          files:
            - "**/internal/providers/retry/**"
          allow:
            - $gostd
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/providers/retry

        # providertest is the Provider contract written as tests, so it gets the
        # contract and the schema and nothing else. No vendor SDK and no file
        # format: a suite that could build one Provider's fixtures would be a
        # suite with an opinion about which Provider it was for.
        providers-providertest:
          list-mode: strict
          files:
            - "**/internal/providers/providertest/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/providers

        # The Anthropic Provider: the vendor's SDK, and the contract it
        # satisfies. It does not read files.
        providers-anthropic:
          list-mode: strict
          files:
            - "**/internal/providers/anthropic/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/providers/anthropic
            # providertest, for the shared contract suite. Test files only —
            # nothing in the implementation can reach it.
            - github.com/missingstudio/eva/internal/providers/providertest
            - github.com/missingstudio/eva/internal/providers/retry
            - github.com/anthropics/anthropic-sdk-go

        # The OpenAI Provider: the standard library's HTTP client, and the
        # contract it satisfies. No vendor SDK — the surface it needs is one
        # POST and one SSE body, and the subscription backend needs a host and
        # headers no SDK ships with. It does not read files.
        providers-openai:
          list-mode: strict
          files:
            - "**/internal/providers/openai/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/providers/openai
            # providertest, for the shared contract suite. Test files only —
            # nothing in the implementation can reach it.
            - github.com/missingstudio/eva/internal/providers/providertest
            - github.com/missingstudio/eva/internal/providers/retry


        # trace writes files. core declares the TraceSink interface; this
        # satisfies it.
        trace:
          list-mode: strict
          files:
            - "**/internal/trace/**"
            - "!**/internal/trace/tracetest/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/trace
            # tracetest, for the shared contract suite. Test files only —
            # nothing in the implementation can reach it.
            - github.com/missingstudio/eva/internal/trace/tracetest

        # tracetest is the TraceSink contract written as tests, so it gets the
        # interface and the schema and nothing else. No trace: a suite that
        # could build one sink's fixtures would be a suite with an opinion
        # about which sink it was for.
        trace-tracetest:
          list-mode: strict
          files:
            - "**/internal/trace/tracetest/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # core, for the TraceSink the suite drives. The interface is the
            # whole of what a sink under test has to be.
            - github.com/missingstudio/eva/internal/core

        # harness owns answering a prompt: the Harness contract, the registry
        # that selects one, and the assembly that opens a Run on a Session and
        # commits what a Harness emits. The assembly lives here because a
        # Frontend, a Server, and a daemon each need it, and a second place that
        # knows how a Run is wired is a second place for the wiring to drift.
        #
        # The absences are why it is a layer rather than a package under the
        # frontend. No tui and no render, so a Harness cannot show a person
        # anything it did not first commit — which is the property a loop grown
        # inside the frontend would have had no rule to keep. No auth: a
        # Credential is obtained by an act a person performs, and the Frontend
        # that performs it hands the resolver in.
        harness:
          list-mode: strict
          files:
            - "**/internal/harness/**"
            # Eva's own Harness is governed by its own rule below, which is
            # narrower than this one rather than wider.
            - "!**/internal/harness/eva/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # core, for the Session a Run opens on, the Recorder every step
            # reaches the Trace through, and the Outcome a Harness returns.
            - github.com/missingstudio/eva/internal/core
            # config, because the assembly is what configuration describes: the
            # Harness, the Provider, the sink, and the identity a Run acts under.
            - github.com/missingstudio/eva/internal/config
            # providers, for the Provider a turn is asked of. The two shipped
            # implementations are imported for their registration alone, by the
            # layer whose lookup fails when nothing registered.
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/providers/anthropic
            - github.com/missingstudio/eva/internal/providers/openai
            # trace, for the sink configuration selects. It is opened here for
            # the same reason the Provider is: this is the layer that wires a Run.
            - github.com/missingstudio/eva/internal/trace
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/harness

        # harness/eva is Eva's own Harness, and one entry in the registry above.
        # It holds the Loop: the Unit that answers a prompt by assembling one
        # call, replaying what the Provider yields into the Trace, and closing
        # the Run with the claim of how it went. One provider turn today; tool
        # dispatch, parallel groups, and approval gates later.
        #
        # No config and no trace: which Provider answers and where the Trace is
        # written are settled above, and what arrives here is a Recorder and a
        # Provider. No tui and no render, for the reason the layer above gives.
        harness-eva:
          list-mode: strict
          files:
            - "**/internal/harness/eva/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # core, for the Unit it satisfies, the Recorder every step reaches
            # the Trace through, and the Session a turn is conditioned on.
            - github.com/missingstudio/eva/internal/core
            # core/prompt, for the base system prompt every turn of this build is
            # conditioned on. It is Eva's own, which is why it is named here and
            # not in the layer that selects a Harness.
            - github.com/missingstudio/eva/internal/core/prompt
            # harness, for the contract this satisfies, the Turn one turn
            # arrives as, and the registry it puts itself in.
            - github.com/missingstudio/eva/internal/harness
            # harnesstest, for the Session a test answers against. See
            # api-tests: one fixture, so two tests that disagree disagree about
            # the thing they are testing.
            - github.com/missingstudio/eva/internal/harness/harnesstest
            # providers, for the Provider a turn is asked of, and the contract
            # alone. No implementation is named: which Provider answers is
            # configuration's to say and the registry's to hold.
            - github.com/missingstudio/eva/internal/providers

        # api is the Session API and the Transports that carry it. It is the only
        # place that knows there is a distance: in this process the assembly
        # answers the API itself, and the Remote Transport speaks to a Server.
        #
        # No config, no providers, and no trace: what a turn is answered with is
        # settled below this layer, and what arrives here is a Session. No tui
        # and no render, because an API a Frontend drives must not know which
        # Frontend.
        api:
          list-mode: strict
          files:
            - "**/internal/api/**"
            - "!**/internal/api/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # core, for the Subscriber a watcher satisfies and the Outcome a turn
            # returns. Both cross the wire, which is what makes them the API's.
            - github.com/missingstudio/eva/internal/core
            # harness is absent, and the absence is the point. This layer states
            # the Session API; what satisfies it in this process is the assembly,
            # which satisfies it by shape rather than by being named here. So the
            # Server's half serves anything that answers those five methods, and
            # a test can put a Session with nothing behind it under one.
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/api

        # api's tests are ADR 0047's falsifier: one suite against both
        # Transports, asserting the same outcomes. Driving a real turn needs a
        # Provider to script and a sink to read, which production api does not.
        # The rule is separate for the reason core-tests is — a test needing a
        # package must not be the reason production code may import it.
        api-tests:
          list-mode: strict
          files:
            - "**/internal/api/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/config
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/harness
            - github.com/missingstudio/eva/internal/harness/eva
            # harnesstest, the one place a test builds a Session's worth of
            # assembly. A fixture that differs per package is a difference a
            # reader has to rule out before trusting two tests that disagree.
            - github.com/missingstudio/eva/internal/harness/harnesstest
            - github.com/missingstudio/eva/internal/api

        # cli is the command line, the process, the exit codes, and the wiring.
        # It is the top of the graph and it holds no terminal: the console is
        # tui's, and the fold a person reads a turn in is render's.
        #
        # providers and trace are gone, and that absence is what this layer
        # narrowing means (ADR 0045). Assembling a Run is not a frontend's job —
        # it moved to harness, where a Server and a daemon can reach it too. What
        # is left here is the process surface, the Credential a person obtained,
        # and the facts about this machine that no Transport carries.
        cli:
          list-mode: strict
          files:
            - "**/internal/cli/**"
            # Tests are governed by cli-tests below. The console lives in tui
            # now, and the tests that drive it type keys into a program — so
            # they need the terminal library that production cli no longer
            # does. Two rules matching one file both apply, so this one stands
            # aside rather than the frontend's list being widened for a test.
            - "!**/internal/cli/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/config
            # auth, for the subscription Credentials a login stores. The store's
            # path is composed here and the token resolver is handed down to the
            # layer that wires a Run — this is the one place config and auth meet.
            - github.com/missingstudio/eva/internal/auth
            # harness, for the assembly a turn is answered by. This hands it a
            # configuration and gets an Assembly; what happens between provider
            # turns is the Harness's and never the frontend's.
            - github.com/missingstudio/eva/internal/harness
            # harness/eva, for its registration alone. Which Harness answers is
            # configuration's to say, and a build says which ones it ships.
            - github.com/missingstudio/eva/internal/harness/eva
            # api, for the Session API this drives and the Transport it drives it
            # over. One turn on a command line and a browser typing the same
            # prompt reach the same five methods.
            - github.com/missingstudio/eva/internal/api
            # render, for the fold a person reads a turn in. It is a layer beside
            # core rather than a package under this one: it holds no terminal,
            # so the frontend consumes it and it consumes nothing of the
            # frontend's.
            - github.com/missingstudio/eva/internal/render
            # tui, the interactive frontend this hands a Session API to.
            - github.com/missingstudio/eva/internal/tui
            # theme, which this maps a person's file onto before handing it in.
            - github.com/missingstudio/eva/internal/theme
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/cli

        # cli's tests drive the whole thing: they build the console, type keys
        # into the program, and read what a person would have, against a
        # Provider they script and a Trace they read. So they get the terminal
        # library, a Provider, and a sink — and production cli gets none of the
        # three. The rule is separate for the reason core-tests is: a test
        # needing a package must not be the reason production code may import it.
        cli-tests:
          list-mode: strict
          files:
            - "**/internal/cli/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/core/prompt
            - github.com/missingstudio/eva/internal/config
            - github.com/missingstudio/eva/internal/auth
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/trace
            - github.com/missingstudio/eva/internal/harness
            - github.com/missingstudio/eva/internal/harness/eva
            # See api-tests: one fixture builds the assembly a test drives.
            - github.com/missingstudio/eva/internal/harness/harnesstest
            - github.com/missingstudio/eva/internal/api
            - github.com/missingstudio/eva/internal/render
            - github.com/missingstudio/eva/internal/tui
            - github.com/missingstudio/eva/internal/theme
            - github.com/missingstudio/eva/internal/cli
            - charm.land/bubbletea

        # tui is the interactive frontend, and it owns the terminal. It is a
        # consumer: core for the Subscriber it satisfies and the Outcome it
        # reads, ui for what it shows.
        #
        # config, providers and trace are absent, and that absence is the whole
        # reason this is a layer of its own rather than a file inside cli.
        # Everything the interface could do with a Provider, a Recorder, or the
        # Trace is something it must not do, and this is where that stops being
        # a discipline and becomes a rule.
        #
        # glamour is absent too. Rendering an answer is what a fold does, and
        # the fold is ui.
        # theme is every colour, glyph, and measurement an interface draws
        # with. It is a layer of its own rather than a package under tui
        # because two things draw: the console, and the fold a person reads a
        # turn in. One grey named in two places is two greys that happen to
        # agree today, and this is the package that makes it one.
        #
        # It gets lipgloss and nothing else Eva has. No events, so a Theme
        # cannot decide what a person is shown as well as how; no config, so
        # the layer that reads a file is still the only layer that reads a
        # file. A Theme that grows an import beyond a colour has stopped
        # describing an interface and become one.
        theme:
          list-mode: strict
          files:
            - "**/internal/theme/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/theme
            - charm.land/lipgloss

        # keymap is which keys do what. It sits under tui because only a
        # console has keys, and it gets nothing but the standard library: the
        # rule it exists to hold — that a binding must not take a character
        # away from the prompt — is about the shape of a chord and needs no
        # terminal to check.
        tui-keymap:
          list-mode: strict
          files:
            - "**/internal/tui/keymap/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/tui/keymap

        tui:
          list-mode: strict
          files:
            - "**/internal/tui/**"
            # keymap is governed by its own rule above, which is narrower than
            # this one rather than wider.
            - "!**/internal/tui/keymap/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            # api, for the Session API the console drives. The interface and
            # nothing behind it: which Transport carries it is not a thing an
            # interface may know.
            - github.com/missingstudio/eva/internal/api
            - github.com/missingstudio/eva/internal/render
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/tui
            - github.com/missingstudio/eva/internal/theme
            - charm.land/bubbletea
            - charm.land/bubbles
            - charm.land/lipgloss
            # x/term, for the console's own check of whether a descriptor is
            # one the terminal libraries can watch for readiness. It is the
            # same package bubbletea itself asks, so a file this rejects is
            # one bubbletea would have rejected too — just before the failure
            # instead of during it.
            - github.com/charmbracelet/x/term

        # render folds committed Events into text. It is not a frontend: it holds no
        # terminal, no input, and no way to reach a Provider, a Session, or the
        # Trace, so it sits beside core rather than inside the layer that owns
        # the screen. The Event schema and the terminal libraries, and nothing
        # else Eva has.
        #
        # The omissions are the rule. A fold that could reach a provider, a
        # Session, or the Trace could show a person a turn the record does not
        # hold, and the screen would stop being an account of what was
        # committed. core is absent too, which costs a compile-time assertion
        # that the Renderer satisfies Subscriber; the assertion happens where a
        # Renderer is built instead.
        render:
          list-mode: strict
          files:
            - "**/internal/render/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/render
            # theme, for the greys and glyphs the console names too. One
            # package so that "subdued" is one colour rather than two.
            - github.com/missingstudio/eva/internal/theme
            - charm.land/lipgloss
            - charm.land/glamour

        # cmd holds the binaries, and a binary is the one place that is allowed
        # to know how the program is assembled. It gets the frontend and the
        # standard library, and nothing else: a main that could reach a
        # provider or the Trace would be a second place where a run is wired,
        # and the wiring would drift between them.
        #
        # Everything a command needs is therefore something the frontend
        # already exposes. When a second binary arrives and needs more, the
        # answer is a package it can share, not a wider list here.
        cmd:
          list-mode: strict
          files:
            - "**/cmd/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/cli

    # gosec, whose findings on this tree were read one at a time. Two rules are
    # wrong about this program everywhere, so they are off everywhere. The rest
    # are dispositioned per file in the exclusions below.
    gosec:
      excludes:
        # Integer overflow on a conversion. Every hit constructs a wire
        # position in a test, from a loop counter that cannot reach the range
        # the rule is worried about.
        - G115
        # A weak random number generator. The two callers are retry jitter and
        # picking a caption, and a cryptographic generator would be wrong for
        # both: one wants a spread, the other wants a word.
        - G404

  # Exclusions are narrow on purpose. A blanket `gosec: false` would be shorter
  # and would tell the next reader nothing about which findings were read and
  # judged. What these buy is the ninth finding, in a file where the first eight
  # were understood.
  exclusions:
    rules:
      # A test constructs the conditions it needs, including a subprocess, a
      # temporary file, and a slice index the rule cannot see the bound of.
      - path: _test\.go$
        linters: [gosec]
      - path: internal/trace/tracetest/
        linters: [gosec]

      # G101 flags the names ANTHROPIC_API_KEY and OPENAI_API_KEY as though they
      # were the keys. They are the variables a credential is read from, which
      # is the one place a secret is allowed to enter.
      #
      # G703 flags the configuration and trace paths as tainted. Each is built
      # from the user's own home directory, and each file is written 0o600.
      - path: internal/config/config\.go$
        linters: [gosec]
        text: "G101|G703"

      # The auth store exists to hold a token, and its file is the one place a
      # subscription Credential lives. See ADR 0032.
      - path: internal/auth/store\.go$
        linters: [gosec]
        text: "G117"

      # One reads .git/HEAD to name the branch. The other opens the Trace the
      # configuration named, append-only and 0o600, which is the whole job of a
      # sink. Both are deliberate, and both say so where they are written.
      - path: (internal/cli/about|internal/trace/sink)\.go$
        linters: [gosec]
        text: "G304"

      # G704 reads the address the Remote Transport dials as tainted, because it
      # arrives as a parameter. Dialing an address somebody named is what a
      # client is: it comes from --server or from a Registration the Service
      # wrote, and nothing a Session holds can steer it. A rule that forbade it
      # would forbid the Transport (ADR 0047).
      - path: internal/api/remote\.go$
        linters: [gosec]
        text: "G704"

# A capped count understates exactly the rules that fire most, which are the
# ones a policy has to cover. The first audit of this repository read 19 gosec
# findings where there were 29, because of the default cap of three per rule.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
