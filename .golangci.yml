version: "2"

# The layer boundaries are enforced here, by depguard, rather than by a
# hand-written test. Every rule uses list-mode "strict": an import is allowed
# only if it appears in the allow list. That means the rules fail CLOSED — a
# dependency nobody thought about is rejected rather than quietly permitted.
#
# Adding a line to an allow list is therefore a deliberate act, and reviewing
# that line is how a layer's contract stays true.

linters:
  enable:
    - depguard

  settings:
    depguard:
      rules:
        # events is the bottom of the graph: every layer may depend on it, so a
        # dependency here becomes a dependency everywhere. Standard library only.
        events:
          list-mode: strict
          files:
            - "**/internal/events/**"
          allow:
            - $gostd
            # The external test package events_test sits in this directory and
            # imports the package it tests. A package cannot import itself, so
            # this line reaches test files and nothing else.
            - github.com/missingstudio/eva/internal/events

        # core is pure. It holds the domain and the interfaces the outer layers
        # implement, and it never reaches the outside world.
        #
        # The allow list is deliberately almost empty. core currently imports
        # nothing, and each standard-library package it comes to need should be
        # added here on purpose, by whoever needs it, rather than inherited from
        # a blanket $gostd. That friction is the contract doing its job.
        core:
          list-mode: strict
          files:
            - "**/internal/core/**"
            # Test files are governed by core-tests below. Two rules matching
            # one file both apply, so this one has to stand aside rather than
            # the other one being made more permissive.
            - "!**/internal/core/**_test.go"
            # The base system prompt is governed by core-prompt below, which is
            # what lets embed be granted to the one package that reads a file
            # rather than to the whole of the domain.
            - "!**/internal/core/prompt/**"
          allow:
            - github.com/missingstudio/eva/internal/events
            # context, for the TraceSink interface: a durable append is
            # cancellable, and an interface that cannot carry cancellation
            # forces every implementation to invent its own.
            - context
            # sync, for the Recorder. It owns the wire position and it is the
            # one path an Event takes to the Trace, and stage 2 runs parallel
            # tool groups against one Recorder. A counter that is only safe by
            # convention is a data race waiting for its second goroutine.
            - sync
            # errors and fmt, for the Recorder's own failures. A Recorder
            # built without a clock, and a payload this schema does not know,
            # are both reported rather than written.
            - errors
            - fmt

        # core's tests get the standard library, and nothing else core does not
        # already have. The rule is separate so that core's own allow list stays
        # the short, deliberate list it was written as — a test needing a
        # package must not be the reason production code may import it.
        core-tests:
          list-mode: strict
          files:
            - "**/internal/core/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core

        # core/prompt holds the base system prompt and the gate on its size. It
        # is the one package under core that reads a file, and it reads it at
        # compile time: embed puts the bytes in the binary, so nothing reaches
        # the filesystem while a Run is going and core stays pure.
        #
        # It is a rule of its own so that embed is granted to the package that
        # needs it instead of to the whole domain. The two cannot import each
        # other — neither list names the other, and both are strict — which is
        # what keeps the prose a turn is conditioned on from growing a
        # dependency on the domain it conditions.
        core-prompt:
          list-mode: strict
          files:
            - "**/internal/core/prompt/**"
            - "!**/internal/core/prompt/**_test.go"
          allow:
            - embed
            - fmt

        # The gate on the prompt's size is a test, so it gets what a test needs
        # and core/prompt keeps the two-package list above.
        core-prompt-tests:
          list-mode: strict
          files:
            - "**/internal/core/prompt/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/core/prompt

        # config reads files, so it sits outside core.
        config:
          list-mode: strict
          files:
            - "**/internal/config/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/BurntSushi/toml
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/config

        # providers holds the contract: the Provider and Stream interfaces, and
        # the Call a turn is asked with. It talks to nothing — the packages
        # under it do — so it gets no vendor's SDK and no file format.
        #
        # Each implementation has a rule of its own below. One rule over the
        # whole subtree would grant every dependency to every implementation,
        # so the fake would be allowed the Anthropic SDK and the Anthropic
        # Provider would be allowed to read files. Both lists said what they
        # were for and neither could enforce it.
        providers:
          list-mode: strict
          files:
            - "**/internal/providers/**"
            - "!**/internal/providers/anthropic/**"
            - "!**/internal/providers/fake/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # core, for the Message a Call carries. It is the transcript a turn
            # is conditioned on, and it is the whole of what this layer needs
            # from the domain.
            - github.com/missingstudio/eva/internal/core
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/providers

        # The Anthropic Provider: the vendor's SDK, and the contract it
        # satisfies. It does not read files.
        providers-anthropic:
          list-mode: strict
          files:
            - "**/internal/providers/anthropic/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/providers/anthropic
            - github.com/anthropics/anthropic-sdk-go

        # The fake Provider replays a recorded turn, so it reads one: toml, and
        # no vendor's SDK. It reads its own recording rather than being handed
        # one because the layer that reads files is config, and config may not
        # import providers.
        #
        # core is absent. A recording answers from a file and is conditioned on
        # nothing, so the one type this layer takes from the domain is one the
        # fake never touches.
        providers-fake:
          list-mode: strict
          files:
            - "**/internal/providers/fake/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/providers/fake
            - github.com/BurntSushi/toml

        # trace writes files. core declares the TraceSink interface; this
        # satisfies it.
        trace:
          list-mode: strict
          files:
            - "**/internal/trace/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/trace

        # cli assembles a run and is the top of the graph. It may import
        # everything below it, and it holds no terminal: the console is tui's,
        # and the fold a person reads a turn in is ui's. What is left here is
        # the process surface and the wiring.
        cli:
          list-mode: strict
          files:
            - "**/internal/cli/**"
            # Tests are governed by cli-tests below. The console lives in tui
            # now, and the tests that drive it type keys into a program — so
            # they need the terminal library that production cli no longer
            # does. Two rules matching one file both apply, so this one stands
            # aside rather than the frontend's list being widened for a test.
            - "!**/internal/cli/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/config
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/trace
            # ui, for the fold a person reads a turn in. It is a layer beside
            # core rather than a package under this one: it holds no terminal,
            # so the frontend consumes it and it consumes nothing of the
            # frontend's.
            - github.com/missingstudio/eva/internal/ui
            # tui, the interactive frontend this hands a built assembly to.
            - github.com/missingstudio/eva/internal/tui
            # theme, which this maps a person's file onto before handing it in.
            - github.com/missingstudio/eva/internal/theme
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/cli

        # cli's tests drive the console themselves: they build it, type keys
        # into the program, and read what a person would have. So they get the
        # terminal library, and production cli does not. The rule is separate
        # for the reason core-tests is — a test needing a package must not be
        # the reason production code may import it.
        cli-tests:
          list-mode: strict
          files:
            - "**/internal/cli/**_test.go"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/config
            - github.com/missingstudio/eva/internal/providers
            - github.com/missingstudio/eva/internal/trace
            - github.com/missingstudio/eva/internal/ui
            - github.com/missingstudio/eva/internal/tui
            - github.com/missingstudio/eva/internal/theme
            - github.com/missingstudio/eva/internal/cli
            - charm.land/bubbletea

        # tui is the interactive frontend, and it owns the terminal. It is a
        # consumer: core for the Subscriber it satisfies and the Outcome it
        # reads, ui for what it shows.
        #
        # config, providers and trace are absent, and that absence is the whole
        # reason this is a layer of its own rather than a file inside cli.
        # Everything the interface could do with a Provider, a Recorder, or the
        # Trace is something it must not do, and this is where that stops being
        # a discipline and becomes a rule.
        #
        # glamour is absent too. Rendering an answer is what a fold does, and
        # the fold is ui.
        # theme is every colour, glyph, and measurement an interface draws
        # with. It is a layer of its own rather than a package under tui
        # because two things draw: the console, and the fold a person reads a
        # turn in. One grey named in two places is two greys that happen to
        # agree today, and this is the package that makes it one.
        #
        # It gets lipgloss and nothing else Eva has. No events, so a Theme
        # cannot decide what a person is shown as well as how; no config, so
        # the layer that reads a file is still the only layer that reads a
        # file. A Theme that grows an import beyond a colour has stopped
        # describing an interface and become one.
        theme:
          list-mode: strict
          files:
            - "**/internal/theme/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/theme
            - charm.land/lipgloss

        # keymap is which keys do what. It sits under tui because only a
        # console has keys, and it gets nothing but the standard library: the
        # rule it exists to hold — that a binding must not take a character
        # away from the prompt — is about the shape of a chord and needs no
        # terminal to check.
        tui-keymap:
          list-mode: strict
          files:
            - "**/internal/tui/keymap/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/tui/keymap

        tui:
          list-mode: strict
          files:
            - "**/internal/tui/**"
            # keymap is governed by its own rule above, which is narrower than
            # this one rather than wider.
            - "!**/internal/tui/keymap/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            - github.com/missingstudio/eva/internal/core
            - github.com/missingstudio/eva/internal/ui
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/tui
            - github.com/missingstudio/eva/internal/theme
            - charm.land/bubbletea
            - charm.land/bubbles
            - charm.land/lipgloss
            # x/term, for the console's own check of whether a descriptor is
            # one the terminal libraries can watch for readiness. It is the
            # same package bubbletea itself asks, so a file this rejects is
            # one bubbletea would have rejected too — just before the failure
            # instead of during it.
            - github.com/charmbracelet/x/term

        # ui folds committed Events into text. It is not a frontend: it holds no
        # terminal, no input, and no way to reach a Provider, a Session, or the
        # Trace, so it sits beside core rather than inside the layer that owns
        # the screen. The Event schema and the terminal libraries, and nothing
        # else Eva has.
        #
        # The omissions are the rule. A fold that could reach a provider, a
        # Session, or the Trace could show a person a turn the record does not
        # hold, and the screen would stop being an account of what was
        # committed. core is absent too, which costs a compile-time assertion
        # that the Renderer satisfies Subscriber; the assertion happens where a
        # Renderer is built instead.
        ui:
          list-mode: strict
          files:
            - "**/internal/ui/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/events
            # See the events rule: this reaches the external test package only.
            - github.com/missingstudio/eva/internal/ui
            # theme, for the greys and glyphs the console names too. One
            # package so that "subdued" is one colour rather than two.
            - github.com/missingstudio/eva/internal/theme
            - charm.land/lipgloss
            - charm.land/glamour

        # cmd holds the binaries, and a binary is the one place that is allowed
        # to know how the program is assembled. It gets the frontend and the
        # standard library, and nothing else: a main that could reach a
        # provider or the Trace would be a second place where a run is wired,
        # and the wiring would drift between them.
        #
        # Everything a command needs is therefore something the frontend
        # already exposes. When a second binary arrives and needs more, the
        # answer is a package it can share, not a wider list here.
        cmd:
          list-mode: strict
          files:
            - "**/cmd/**"
          allow:
            - $gostd
            - github.com/missingstudio/eva/internal/cli
