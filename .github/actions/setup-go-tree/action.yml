name: Set up the Go tree
description: >-
  The toolchain and the caches every job in this repository needs, in one place
  rather than eight. Checkout is not here on purpose: a local action is read out
  of the workspace, so the repository has to be on disk before this can run.

inputs:
  lint-cache:
    description: >-
      Also restore golangci-lint's analysis cache. Only the jobs that run the
      linter want it, and it is keyed on the linter rather than on the module.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: true

    # The pin is asked of the Makefile rather than read out of it with a
    # regex. `make tool-versions` is the interface; the assignments are not.
    - name: Read the pinned linter version
      id: pin
      if: inputs.lint-cache == 'true'
      shell: bash
      run: |
        set -eu
        version=$(make tool-versions | sed -n 's/^GOLANGCI_VERSION=//p')
        test -n "$version"
        echo "golangci=$version" >> "$GITHUB_OUTPUT"

    # Keyed on the linter's own version and its configuration. Keying this on
    # the Makefile's hash meant a comment there threw away the analysis cache.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.lint-cache == 'true'
      with:
        path: ~/.cache/golangci-lint
        key: golangci-${{ runner.os }}-${{ steps.pin.outputs.golangci }}-${{ hashFiles('.golangci.yml') }}
