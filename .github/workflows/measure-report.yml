name: Measure report

# Files a failed scheduled measurement where the project keeps its work:
# GitHub issues. It watches Measure from outside for exactly the reason
# audit-report.yml watches Audit: a reusable workflow may not request more
# permission than its caller grants, so an issues:write job inside would
# make the measurement un-callable. Watching from here keeps measure.yml
# asking for nothing but contents:read.
on:
  workflow_run:
    workflows: [Measure]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: report
    # Only a scheduled measurement that failed. A failure on a dispatch is
    # already in front of the person who caused it and files nothing.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File the failure where the project keeps its work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TITLE: The scheduled measurement is failing
        run: |
          set -eu

          # It comments on the open report rather than filing a second one,
          # so a rate that stays low for a quarter is one issue with three
          # notes. Matched on the exact title rather than through a label,
          # because a label that does not exist yet would turn this into a
          # second failure.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            echo "commented on #$existing"
            exit 0
          fi

          cat > /tmp/measure-failure.md <<BODY
          The scheduled measurement failed.

          $RUN_URL

          Nothing in the tree gates on this, so the deterministic half is
          still green. The run prints the ratios per Workflow and the
          aggregate; a \`no_such_model\` failure means the vendor retired
          the pinned model, and the fix is a reviewed change to
          packages/exit-test/fixture/config.yaml.
          BODY

          gh issue create --title "$TITLE" --body-file /tmp/measure-failure.md
          echo "opened a new issue"
