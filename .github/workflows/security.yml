name: Security

# gosec, over Eva's own code: unsafe patterns written here, rather than
# vulnerabilities inherited from a dependency. Those are audit.yml's job, and the
# two are separate because they fail for different reasons — this one fails
# because of the diff in front of you, and that one can fail because of a
# database published overnight.
#
# There is no schedule. gosec's verdict is a pure function of the tree, so a
# scheduled run would spend a runner confirming the last commit's answer. What
# changes this file's mind is a commit, and a commit is what triggers it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this file, so a release cannot be the one run that
  # skipped the security gate.
  workflow_call:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}

      # `make gosec` runs golangci-lint with gosec alone, against the same
      # .golangci.yml the lint job reads. One configuration, two invocations:
      # the exclusions and their reasons live in one file, and neither job
      # repeats the other's work.
      #
      # Twelve findings in this tree were read and dispositioned when this landed.
      # What the gate is for is the thirteenth.
      - run: make gosec
