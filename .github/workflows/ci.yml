name: CI

# The tree's own correctness: does it check, does it pass, does it pack, and
# does the release path still run. Two concerns live in files of their own
# beside this one, because they fail for different reasons:
#
#   security.yml   CodeQL, over Eva's own code
#   audit.yml      the dependency graph, on a schedule as well as per change
#
# There is no schedule here. Every job is a pure function of the tree, so its
# verdict cannot change while the commit does not — a scheduled run would
# spend runners confirming the last commit's answer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this file, so a release cannot check less than
  # a pull request does.
  workflow_call:

# A superseded pull-request run is cancelled. The event name is part of the
# group so a release's call of this file never shares a group with a push run
# on the same ref — a push landing mid-release must not cancel the release's
# checks.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Direct, never `vp install`: vp delegates to the detected package
      # manager, and going direct removes one layer of guessing.
      - run: bun install --frozen-lockfile

      # The desk command `bun run verify` also runs `bun audit`. That step is
      # absent here on purpose: a red CI must mean the commit is wrong, and an
      # advisory published overnight is not the commit's doing. audit.yml
      # owns that verdict.
      - run: bun run check
      - run: bun run test
      - run: bun run build

  # The release path, run without a dispatch: every target compiled, archived,
  # checksummed, the cask and the npm packages written, nothing published. It
  # only runs when a change can reach that path, because it compiles five
  # targets — and everything it asserts about the tree's correctness is
  # asserted by verify on every push regardless.
  rehearse:
    name: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The guard measures the range since the previous tag, and the
          # changed-file test below needs the base commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The job runs and decides, rather than being skipped by a condition. A
      # skipped job is not a passing one, and the gate below would need a
      # second exception to tell the two apart.
      - name: Decide whether this change can reach the release path
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull request, so the release path is rehearsed"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -qE '^(scripts/release/|apps/web/|\.github/workflows/(ci|release)\.yml|package\.json|bun\.lock|bunfig\.toml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing here reaches the release path"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        run: bun run rehearse

  # Branch protection requires this job and nothing else. A skipped job is
  # not a passing one, and this is what tells the two apart.
  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [verify, rehearse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          printf '%s\n' "$RESULTS"
          printf '%s' "$RESULTS" | jq -e '
            [ to_entries[] | select(.value.result != "success") ] as $bad
            | if ($bad | length) == 0 then true
              else ($bad | map("\(.key): \(.value.result)") | join(", ") | halt_error(1))
              end
          ' > /dev/null
          echo "every needed job succeeded"
