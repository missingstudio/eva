name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # A check that quietly covered nothing would look identical to one that
      # passed. One module makes ./... honest, and this step gates on it staying
      # that way: a go.mod anywhere below the root would cut its whole subtree
      # out of ./... and every target would still report success.
      - name: Assert the check covers the repository
        run: |
          set -eu
          n=$(go list ./... | wc -l | tr -d ' ')
          echo "$n package(s)"
          [ "$n" -gt 0 ] || { echo "go list ./... resolves no packages"; exit 1; }
          nested=$(find . -mindepth 2 -name go.mod -not -path './.git/*')
          [ -z "$nested" ] || {
            echo "a go.mod below the root hides packages from ./...:"
            echo "$nested"
            exit 1
          }

      - name: Check
        run: make check
