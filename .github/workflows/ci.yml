name: CI

# The tree's own correctness: does it build, does it pass, does it respect its
# layer boundaries. Two concerns live in files of their own beside this one,
# because they fail for different reasons and want different schedules:
#
#   security.yml   gosec, over Eva's own code
#   audit.yml      the dependency graph, on a schedule as well as per change
#
# There is no schedule here. Every job in this file is a pure function of the
# tree, so its verdict cannot change while the commit does not — a scheduled run
# would spend runners to confirm the last commit's answer.
on:
  push:
    # Tags are absent on purpose. A tag is the release workflow's trigger, and it
    # calls this file — so naming tags here would run every check twice on the
    # one push where finishing matters most.
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A superseded run is cancelled. Tags are exempt, because a release run that is
# cancelled half way has already published some of what it built.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # readonly so that no build can edit go.mod to make itself pass. local so a
  # go directive cannot pull a toolchain nobody pinned, mid-build.
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

defaults:
  run:
    # Windows runners default to pwsh, and the Makefile is written for a shell.
    shell: bash

jobs:
  # Fails in seconds, ahead of everything that needs a compile. A misformatted
  # file should not wait on a race-detector run to be reported.
  quick:
    name: quick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-tree

      - run: make fmt
      - run: make guard-test
      - run: make install-test

  # build, vet and test share one compile graph, so they share one job. Split
  # across three, a two-core runner would compile the same dependencies three
  # times over and finish later than this.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-tree

      - run: make build
      - run: make vet
      - run: make test

      # Nothing in this repository carries a build constraint, so a target that
      # stops compiling is a dependency's doing rather than ours. Two targets
      # cover the dimension where that happens: a different operating system.
      # The other three are same-OS and are built at release.
      - name: Cross-compile the platforms this job does not run on
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for target in windows/amd64 darwin/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./...
          done

  # macOS and Windows at merge and at a tag, never on a pull request — where
  # cross-compilation above catches what a compiler can catch, for seconds.
  platforms:
    name: platforms
    if: github.event_name != 'pull_request'
    strategy:
      # "Windows failed" and "Windows and macOS failed" are different bug
      # reports. Cancelling the second to save a minute costs an hour.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-tree

      # go directly rather than through make: the race detector needs a C
      # toolchain that a Windows runner does not reliably have, and make itself
      # is not part of that image's contract. This is deliberately a subset of
      # `make test` — the ordering is shuffled, the race detector is the Linux
      # job's — and naming it here is what keeps that visible.
      - run: go build ./...
      - run: go test -shuffle=on ./...

  # Its own job because it has its own binary and its own analysis cache, and
  # neither is invalidated by what invalidates the Go build cache.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-tree
        with:
          lint-cache: "true"

      # Uploading these findings to code scanning would want SARIF, and
      # golangci-lint v2.12.2 does not emit it — the writers it has are text,
      # json, tab, html, checkstyle, code-climate and junit-xml. So a finding
      # lives in this job's log until that changes. A step that pretended
      # otherwise would be worse than the gap.
      - run: make lint

  # The release path, run without a tag. It only runs when something it would
  # catch has changed, because it downloads GoReleaser and compiles five
  # targets — and everything it asserts about the tree is asserted by the jobs
  # above on every push regardless.
  rehearse:
    name: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The guard measures a tag's range, and the changed-file test below
          # needs the base commit, so the whole history has to be here.
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-tree

      # The job runs and decides, rather than being skipped by a condition. A
      # skipped job is not a passing one, and the gate below would have to be
      # taught a second exception to tell the two apart.
      - name: Decide whether this change can reach the release path
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull request, so the release path is rehearsed"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -qE '^(Makefile|\.goreleaser\.yaml|scripts/|go\.mod|\.github/(workflows/(ci|release)\.yml|actions/))'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing here reaches the release path"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - run: make rehearse
        if: steps.scope.outputs.run == 'true'

  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [quick, test, platforms, lint, rehearse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Makefile declares what is checked, and the workflows run it. The
      # assertion that the two agree is a script rather than a step, so it runs
      # at a desk as well as here — a difference between the lists was
      # previously only ever reported by a build.
      - run: make check-coverage

      # A skipped job is not a passing one, which is the whole reason this job
      # exists rather than branch protection naming the others directly.
      # platforms is skipped by design on a pull request, and it is the only
      # result allowed to be anything but success.
      - name: Assert every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          printf '%s\n' "$RESULTS"
          printf '%s' "$RESULTS" | jq -e --arg event "$EVENT" '
            ( if $event == "pull_request" then ["platforms"] else [] end ) as $may_skip
            | [ to_entries[]
                | select(.value.result != "success")
                | select((.value.result == "skipped" and (.key | IN($may_skip[]))) | not)
              ] as $bad
            | if ($bad | length) == 0 then true
              else ($bad | map("\(.key): \(.value.result)") | join(", ") | halt_error(1))
              end
          ' > /dev/null
          echo "every needed job succeeded (trigger: $EVENT)"
