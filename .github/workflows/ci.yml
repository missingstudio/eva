name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # A workspace-wide check that quietly covered nothing would look identical
      # to one that passed. This step gates on that rather than only printing it:
      # every module must resolve at least one package.
      - name: Assert the workspace is fully covered
        run: |
          set -eu
          modules=$(go list -m -f '{{.Dir}}')
          [ -n "$modules" ] || { echo "go list -m found no modules"; exit 1; }
          for d in $modules; do
            n=$(cd "$d" && go list ./... | wc -l | tr -d ' ')
            echo "$(basename "$d"): $n package(s)"
            [ "$n" -gt 0 ] || { echo "module $d resolves no packages"; exit 1; }
          done

      - name: Check
        run: make check
