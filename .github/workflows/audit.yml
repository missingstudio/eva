name: Audit

# The dependency graph: what Eva inherited rather than what it wrote. gosec, which
# reads Eva's own code, is security.yml.
#
# This is the one workflow in the repository with a schedule, and it is the only
# one that earns one. A vulnerability is published on somebody else's timetable,
# so a dependency's verdict changes while the tree does not. Without a clock, a
# repository that sits quiet for three weeks reports green for three weeks and
# means "green as of the last time anyone happened to push". The schedule's
# period sets the worst case: a vulnerability published just after a run goes
# unseen for one period, unless somebody pushes in the meantime.
#
# That is not hypothetical here. The first scan of this repository found two
# reachable vulnerabilities, and nothing had been watching for them.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 07:23 UTC, the morning Dependabot also opens its grouped pull
    # requests. The week's dependency news then arrives together: what needs
    # bumping, and what is already known to be exploitable. An odd minute,
    # because everything scheduled on the hour queues behind everything else
    # scheduled on the hour.
    #
    # This line and the README's workflow table are the only two places the
    # cadence is written. Everything else says "on a schedule", so changing it
    # here does not leave a dozen comments claiming otherwise.
    - cron: "23 7 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-tree

      # Integrity first, and cheaply: a module graph that drifted from the
      # imports, and a module cache whose content no longer matches go.sum.
      - run: make tidy-check
      - run: make mod-verify

      # Then the database. govulncheck reports by reachable symbol rather than by
      # module version, so a vulnerability in code Eva never calls does not fail
      # this — which is what makes it a gate instead of a wall of noise.
      - run: make vuln