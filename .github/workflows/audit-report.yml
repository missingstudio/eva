name: Audit report

# Files a failed scheduled audit where the project keeps its work: GitHub issues,
# per docs/agents/issue-tracker.md. A scheduled failure otherwise emails the last
# person who committed to the default branch, which is not a channel anyone
# watches — and a gate that reports to nobody is a gesture.
#
# This watches Audit from outside rather than being a job inside it, and the
# reason is load-bearing. A reusable workflow may not request more permission
# than its caller grants. As a job in audit.yml this asked for issues:write,
# which made audit.yml un-callable by the release workflow — that run failed
# before a single job started, on a job that would have been skipped anyway.
#
# Watching from here keeps the audit gate asking for nothing but contents:read.
on:
  workflow_run:
    workflows: [Audit]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: report
    # Only a scheduled audit that failed. A failure on a pull request or a push
    # is already in front of the person who caused it.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File the failure where the project keeps its work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TITLE: The scheduled audit is failing
        run: |
          set -eu

          # It comments on the open report rather than filing a second one, so a
          # vulnerability that stays unfixed for a month is one issue with four
          # notes. Matched on the exact title rather than through a label,
          # because a label that does not exist yet would turn this into a
          # second failure.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            echo "commented on #$existing"
            exit 0
          fi

          cat > /tmp/audit-failure.md <<BODY
          The scheduled audit failed.

          $RUN_URL

          Nothing in the tree changed, so this is a vulnerability published
          against a dependency Eva already had. The run names the advisory and
          the call path that reaches it.

          The fix is usually a version bump. Where no fixed version exists, the
          suppression names the ID, the reason, the person, and a review date —
          a suppression with no date is a permanent silence dressed as a
          decision.
          BODY

          gh issue create --title "$TITLE" --body-file /tmp/audit-failure.md
          echo "opened a new issue"
