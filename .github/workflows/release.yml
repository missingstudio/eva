name: Release
run-name: release ${{ inputs.version || inputs.bump }}

# A release is one button: this dispatch, with a bump or an explicit version.
# The decision stays human — somebody chooses the moment and the bump — and
# the mechanics stay here, where they are logged and identical every time.
#
# Every gate runs before anything is published. A failed gate leaves no
# commit, no tag, no release, and no artifact. The point of no return is the
# push of the bump commit and its tag, and it comes after the gates, the
# build, and the guard have all passed.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump the previous release"
        required: false
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit version, for what a bump cannot spell (an rc, the first release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One release at a time, and never cancelled: a release stopped half way
  # has already published some of what it built.
  group: release
  cancel-in-progress: false

jobs:
  # Every gate, by calling the files that define them rather than restating
  # them. All three, because a release that skipped one would be a release
  # nobody checked that thing on.
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  security:
    name: security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  audit:
    name: audit
    uses: ./.github/workflows/audit.yml

  release:
    name: release
    needs: [checks, security, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To push the bump commit and the tag, and to create the release.
      contents: write
      # For cosign's keyless signing and npm's trusted publishing. Both use
      # this workflow's own OIDC identity, which is why neither needs a
      # stored secret.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The notes are a fold over the commits since the previous tag, and
          # the guard measures that range, so the whole history has to be here.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Node for npm alone: trusted publishing needs a current npm, and bun
      # runs everything else. No registry-url — that writes an .npmrc token
      # line, and trusted publishing mints its own credential from the OIDC
      # identity instead.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Compute the version
        id: version
        env:
          EVA_BUMP: ${{ inputs.bump }}
          EVA_INPUT_VERSION: ${{ inputs.version }}
        run: bun scripts/release/version.ts

      # The bump commit is made before the build so the tree the tag names is
      # the tree that was built. It is not pushed until everything passes.
      - name: Write the version into the manifest
        env:
          EVA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          (cd apps/cli && npm pkg set "version=$EVA_VERSION")
          bun install
          git -c user.name=eva-release -c user.email=eva@missing.studio \
            commit -am "release: v$EVA_VERSION"

      - name: Build every target
        env:
          EVA_VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/release/build.ts

      - name: Guard
        env:
          EVA_VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/release/guard.ts

      - name: Write the npm packages, the cask, and the notes
        env:
          EVA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          bun scripts/release/npm.ts
          bun scripts/release/cask.ts
          bun scripts/release/notes.ts

      # syft writes the SBOMs, cosign signs the checksum file. The signature
      # is this workflow's own OIDC identity — no secret, nothing to rotate.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums signed, contents named
        run: |
          set -eu
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          for archive in dist/*.tar.gz dist/*.zip; do
            syft "$archive" -o "spdx-json=$archive.sbom.json"
          done

      # The point of no return. Everything before this can fail and leave the
      # repository untouched; everything after this is publishing. If main
      # moved since the dispatch, this push fails fast-forward and the run
      # stops having published nothing — dispatch again.
      - name: Push the bump commit and the tag
        env:
          EVA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          git tag "v$EVA_VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v$EVA_VERSION"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # A prerelease is read off the version, so latest follows from the
          # same fact rather than being asserted beside it.
          prerelease_flags=""
          case "$EVA_VERSION" in
            *-*) prerelease_flags="--prerelease --latest=false" ;;
          esac
          gh release create "v$EVA_VERSION" \
            --title "v$EVA_VERSION" \
            --notes-file dist/notes.md \
            $prerelease_flags \
            dist/*.tar.gz dist/*.zip \
            dist/checksums.txt dist/checksums.txt.sigstore.json \
            dist/*.sbom.json

      # Proves which workflow built each archive, from which commit. Verified
      # with `gh attestation verify <archive> --repo missingstudio/eva`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # npm, then the tap — the tap is last so an expired tap token leaves a
      # public release and a stale tap rather than a failed release.
      - name: Publish the channels
        env:
          EVA_VERSION: ${{ steps.version.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bun scripts/release/publish.ts

      # Kept for the length of a debugging session, separately from the
      # release itself, so a failed publish still leaves the evidence of what
      # was built.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt*
            dist/*.sbom.json
            dist/notes.md
            dist/homebrew/Casks/*.rb
          retention-days: 14
          if-no-files-found: warn
