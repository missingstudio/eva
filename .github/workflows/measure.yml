name: Measure

# The measured half of Stage 1's exit test: the five canned Workflows, run
# against the pinned model in packages/exit-test/fixture, and the ratios
# printed from the one fold. The verdict of this file changes when the
# *model* changes, not when the tree does, so it is not in ci.yml —
# ci.yml is a pure function of the tree and has no schedule.
#
# It cannot be a per-push job, and the reason is not cost (about $12 to $20
# per full run at the vendored rates): it is nondeterminism, wall clock, and
# the one stored provider secret below. A failure files nothing from here —
# measure-report.yml watches from outside, so this job keeps contents: read.
on:
  workflow_dispatch:
  schedule:
    # Monthly, on the 3rd: a model's behavior changes on the vendor's
    # timetable, not the tree's.
    - cron: "17 6 3 * *"

concurrency:
  group: measure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The runner exits non-zero when the aggregate falls below the line,
      # or when more than 2% of the Runs produced no Candidate.
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun packages/exit-test/scripts/measure.ts --each 100 --jobs 4
