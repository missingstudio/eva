# The floor case: one required string, input from piped stdin. If this one
# fails, structured output is broken and the model is not the cause.
name: One conventional commit message from a staged diff
steps:
  - id: message
    template: commit-msg
    with: { diff: input }
    schema:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
