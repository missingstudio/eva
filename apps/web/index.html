<!doctype html>
<!--
  The page is dark only, the way every Eva surface is: the design system ships
  one instrument panel and no light scheme, so nothing here reads the
  operating system's preference. Which colours that panel draws is a theme,
  and the page offers Eva's own three.

  It is a class rather than a media query because the ui package's `dark`
  variant and every `dark:` utility in the imported components answer to the
  class. It is written here rather than set by a script, so it is true before
  the first stylesheet and nothing can flash the wrong skin.
-->
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eva</title>
    <meta
      name="description"
      content="Watch an Eva Session, say what is next, and see what it cost."
    />
    <!--
      The mark is vendored once, in the ui package, and both sites already
      serve that one directory. This page has no static directory of its own,
      so it names the file and the build emits it.
    -->
    <link rel="icon" type="image/svg+xml" href="../../packages/ui/public/favicon.svg" />
  </head>
  <body>
    <div id="page"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
