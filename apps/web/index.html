<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eva</title>
    <meta
      name="description"
      content="Watch an Eva Session, say what is next, and see what it cost."
    />
    <!--
      The mark is vendored once, in the ui package, and both sites already
      serve that one directory. This page has no static directory of its own,
      so it names the file and the build emits it.
    -->
    <link rel="icon" type="image/svg+xml" href="../../packages/ui/public/favicon.svg" />
    <!--
      The skin follows the OS. It is a class rather than a media query because
      the ui package's `dark` variant and every `dark:` utility in the imported
      components answer to the class, and it runs here — before any stylesheet,
      before the first paint — because a class set later flashes the wrong skin.

      A DOM with no matchMedia gets dark, which is Eva's own skin and the state
      every existing test renders under.
    -->
    <script>
      const dark = window.matchMedia?.("(prefers-color-scheme: dark)")
      const apply = () => document.documentElement.classList.toggle("dark", dark?.matches !== false)
      apply()
      dark?.addEventListener("change", apply)
    </script>
  </head>
  <body>
    <div id="page"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
